[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opto-sim"
version = "0.1.0"
description = "Physics-based optical simulation framework for QKD systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2.0",
  "scipy>=1.15",
  "matplotlib>=3.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
